<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        body{
            background-image: url(https://images.rawpixel.com/image_800/czNmcy1wcml2YXRlL3Jhd3BpeGVsX2ltYWdlcy93ZWJzaXRlX2NvbnRlbnQvbHIvcm0zMDktYWV3LTAxM18xXzEuanBn.jpg);
            background-repeat: no-repeat;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 800px;
        }
        .wrapper{
            width: 600px;
            height: 600px;
            display: flex;
            flex-direction: column;
        }
        .header-form{
            height: 300px;
            background-image: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSAF3jvkhiHrC4W-Vu9J_0A1kvni4C5qZrj1w&s);
            background-repeat: no-repeat;
            background-size: cover;
            padding: 50px 50px 0px 50px;
            color: white;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }
        .content-form{
            background-color:azure;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .header-create{
            text-align: right;
        }
        .form{
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 0px 0px 30px 0px;
            text-align: center;
        }
        .input-username{
            padding: 5px 50px 5px 40px;
        }
        .input-password{
            padding: 5px 50px 5px 40px;
        }
        .fa-solid{
            position: absolute;
            margin-top: 5px;
            margin-left: 10px;
        }
        .input-submit{
            padding: 0px 50px 0px 50px;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="header-form">
            <div class="header-title">
                <h2>WELCOME TO THE <br>WEBSITE</h2>
            </div>
            <div class="header-content">
                <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Blanditiis, doloribus.</p>
            </div>
            <div class="header-create">
                <h5>Create Account</h5>
            </div>
        </div>
        <div class="content-form">
            <div class="form">
                <h2>USER LOGIN</h2>
                <div>
                    <i class="fa-solid fa-user"></i>
                    <input type="text" placeholder="Username" class="input-username">
                </div>
                <div>
                    <i class="fa-solid fa-lock"></i>
                    <input type="text" placeholder="Password" class="input-password">
                </div>
                <div style="display: flex; gap:100px"> 
                    <input type="checkbox">
                    <p style="position: absolute; margin-left:25px;">Remember</p>
                    <p>Forgot password ?</p>
                </div>
                <div>
                    <input type="submit" value="LOGIN" class="input-submit">
                </div>
            </div>
        </div>
    </div>
</body>
</html>
