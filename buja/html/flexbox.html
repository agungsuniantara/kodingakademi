<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            background-color: black;
            display: flex;
            gap: 10px;
            height: 100px;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
            flex-direction: column;
        }
        .item{
            width: 50px;
            height: 20px;
            background-color: red;
        }
        .box2{
            background-color: black;
            display: flex;
            height: 100px;
            justify-content:space-around;
            align-items: center;
            margin-bottom: 10px;
        }
        .item2{
            width: 50px;
            height: 20px;
            background-color: red;
        }
        .box3{
            background-color: black;
            display: flex;
            height: 100px;
            gap: 10px;
            justify-content:center;
            align-items: center;
            flex-wrap: wrap;
        }
        .item3{
            width: 50px;
            height: 20px;
            background-color: red;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
    </div>

    <div class="box2">
        <div class="item2"></div>
        <div class="item2"></div>
        <div class="item2"></div>
        <div class="item2"></div>
    </div>

    <div class="box3">
        <div class="item3"></div>
        <div class="item3"></div>
        <div class="item3"></div>
        <div class="item3"></div>
    </div>
</body>
</html>
