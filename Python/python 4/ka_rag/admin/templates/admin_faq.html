<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Admin FAQ - Koding Akademi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: "Segoe UI", Arial, sans-serif; background:#f7f9fa; margin:0; padding:0; }
    .container { max-width: 1500px; margin: 32px auto; background:#fff; border-radius:14px; box-shadow:0 3px 18px rgba(0,0,0,.1); padding: 22px 16px; }
    h2 { text-align:center; color:#294197; font-size:1.55rem; margin:8px 0 18px; }
    .nav { text-align:center; margin-bottom:14px; }
    .nav a { display:inline-block; padding:7px 16px; border-radius:4px; text-decoration:none; background:#f0f4ff; color:#1a255a; margin:0 3px; font-size:1em; }
    .nav a.active, .nav a:hover { background:#294197; color:#fff; }

    table { border-collapse: collapse; width:100%; }
    th, td { padding:10px 8px; border-bottom:1px solid #eee; vertical-align:top; }
    th { background:#f2f3fa; color:#28345a; text-align:left; }
    textarea { width:100%; min-height:48px; resize:vertical; padding:7px 8px; border:1px solid #ccd4e0; border-radius:6px; background:#f9fafd; font-size:.98rem; }
    .btn { display:inline-block; background:#294197; color:#fff; border:none; border-radius:6px; padding:10px 18px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .22s; box-shadow:0 2px 8px rgba(41,65,151,.06); }
    .btn:hover { background:#19255a; }
    .btn-ghost { background:#eef2ff; color:#1a255a; }
    .row-actions { text-align:center; white-space:nowrap; }
    .foot { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:14px; }
    @media (max-width: 720px) { .container{padding:10px 6px 18px;max-width:98vw;} .foot{flex-direction:column;} .btn{width:100%;} }
  </style>
  <script>
    function autoResizeTA(el){ el.style.height='auto'; el.style.height=(el.scrollHeight)+'px'; }
    function enhanceAutoResize(){
      document.querySelectorAll('textarea').forEach(ta=>{
        autoResizeTA(ta);
        ta.addEventListener('input', ()=>autoResizeTA(ta));
      });
    }
    function addRow(){
      const tbody=document.querySelector('#data-body');
      const tr=document.createElement('tr');
      tr.innerHTML=`
        <td><textarea name="question" placeholder="Masukkan pertanyaan" required></textarea></td>
        <td><textarea name="answer" placeholder="Masukkan jawaban" required></textarea></td>
        <td class="row-actions"><button type="button" onclick="this.closest('tr').remove()">🗑️</button></td>`;
      tbody.appendChild(tr);
      enhanceAutoResize();
    }
    window.addEventListener('load', enhanceAutoResize);
  </script>
</head>
<body>
  <div class="container">
    <h2>Panel Admin Knowledgebase<br><small style="font-size:.98em;color:#444;">Koding Akademi</small><br><small style="font-size:1em;color:#587;">FAQ</small></h2>

    <div class="nav">
      <a href="{{ url_for('admin_faq') }}" class="active">FAQ</a>
      <a href="{{ url_for('admin_program') }}">Program/Jadwal</a>
    </div>

    <form method="post" autocomplete="off">
      <table>
        <thead>
          <tr><th style="width:45%;">Pertanyaan</th><th>Jawaban</th><th style="width:70px;">Aksi</th></tr>
        </thead>
        <tbody id="data-body">
          {% for item in data %}
          <tr>
            <td><textarea name="question" required>{{ item.question }}</textarea></td>
            <td><textarea name="answer" required>{{ item.answer }}</textarea></td>
            <td class="row-actions">
              <button type="submit" name="delete" value="{{ loop.index0 }}" onclick="return confirm('Yakin hapus data ini?')">🗑️</button>
            </td>
          </tr>
          {% endfor %}
          {% if data|length == 0 %}
          <tr>
            <td><textarea name="question" placeholder="Masukkan pertanyaan" required></textarea></td>
            <td><textarea name="answer" placeholder="Masukkan jawaban" required></textarea></td>
            <td class="row-actions"></td>
          </tr>
          {% endif %}
        </tbody>
      </table>

      <div class="foot">
        <button type="button" class="btn btn-ghost" onclick="addRow()">+ Tambah Baris</button>
        <button type="submit" class="btn">Simpan Data</button>
      </div>
    </form>

    <div style="text-align:right; font-size:.97rem; margin-top:16px;">
      <a href="{{ url_for('home') }}" style="color:#294197; text-decoration:none;">&larr; Kembali ke Landing</a>
    </div>
  </div>
</body>
</html>
