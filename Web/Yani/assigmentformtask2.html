<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
	font-family: sans-serif;
	background:rgb(240, 170, 240);
}
 
h1{
	text-align: center;
	/*ketebalan font*/
	font-weight: 300;
}
 
.tulisan_login{
	text-align: center;
	/*membuat semua huruf menjadi kapital*/
	text-transform: uppercase;
}
 
.kotak_login{
	width: 350px;
	background: white;
	/*meletakkan form ke tengah*/
	margin: 80px auto;
	padding: 30px 20px;
}
 
label{
	font-size: 11pt;
}
 
.form_login{
	/*membuat lebar form penuh*/
	box-sizing : border-box;
	width: 100%;
	padding: 10px;
	font-size: 11pt;
	margin-bottom: 20px;
}
 
.tombol_login{
	background: purple;
	color: white;
	font-size: 11pt;
	width: 100%;
	border: none;
	border-radius: 3px;
	padding: 10px 20px;
}
    </style>
</head>
<body>z
    <div class="kotak_login">
		<p class="tulisan_login">Contact Us</p>
 
		<form>
			<label>NAME</label>
			<input type="text" name="name" class="form_login" placeholder="Nama">
			<label>EMAIL</label>
			<input type="text" name="email" class="form_login" placeholder="Email">
			<label>MESSAGE</label>
			<input type="text" name="message" class="form_login" placeholder="Message">
			<input type="submit" class="tombol_login" value="Send Your Message">
 
			<br/>
			<br/>
		</form>
		
	</div>
</body>
</html>
