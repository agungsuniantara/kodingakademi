<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daren</title>
    <style>
        .test{
            height: 200px;
            background-color: antiquewhite;
            display: flex;
            gap: 20px;
        }

        .kotak{
            width: 100px;
            height: 50px;
            background-color: black;
        }

        /* media query iphone SE */
        @media only screen and (max-width: 375px) {
            .test{
               height: 500px; 
            }
        }

        /* media query iphone XR */
        @media only screen and (max-width: 414px) {
            .test{
                background-color: red;
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="test">
        <div class="kotak"></div>
        <div class="kotak"></div>
        <div class="kotak"></div>
    </div>
</body>
</html>
