<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            height: 100%;
            margin: 0;
            background-image: url(https://img.freepik.com/free-vector/hand-painted-watercolor-pastel-sky-background_23-2148902771.jpg?w=2000);
            background-repeat: no-repeat;
            background-size: 100%;
        }
        input[type=text], input[type=password] {
            width: 100%;
            padding: 7px;
            margin-bottom: 20px;
            border: none;
            border-bottom: 2px solid red;
            font-size: small;
        }
        input[type=submit]{
            padding: 10px 100px;
            margin-top: 10px;
            background-color: red;
            color: white;
            border: none;
            cursor: pointer;
        }
        .button{
            text-align: center;
        }
        .parent{
            margin: auto;
            margin-top: 10%;
            padding: 10px;
            height: 350px;
            width: 500px;
            background-repeat: no-repeat;
            background-size: 100%;
        }
        .parent2{
            margin-left: 50px;
            margin-right: 50px;
        }
        .filter{
            position: absolute;
            background-image: url(https://cdn-2.tstatic.net/bangka/foto/bank/images/13112021cb.jpg);
            width: 500px;
            height: 370px;
            background-repeat: no-repeat;
            filter: opacity(10%);
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="filter"></div>
        <h1 style="text-align: center;">Contact Us</h1>
        <div class="parent2">
            <form>
                <label>Username : </label>
                <input type="text" required>
                <label>Alamat :</label>
                <input type="text">
                <label>Password :</label>
                <input type="password">
                <div class="button">
                    <input type="submit" value="login">
                </div>
            </form>
        </div>
    </div>
    
</body>
</html>
