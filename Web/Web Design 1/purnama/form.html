<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        background-image: url(https://www.greeners.co/wp-content/uploads/2023/01/0110-Beruang-Coklat-Ursus-arctos.jpg);
        background-repeat: no-repeat;
        background-size: cover;
      }

      .form {
        background-color: white;
        width: 250px;
        height: 300px;
        margin-left: 230px;
        padding: 5px 4px 0 4px;
      }
      .form > h5 {
        text-align: center;
      }
      .form > label {
        font-size: 13px;
      }
      .form > input {
        width: 245px;
        outline: none;
        margin-top: 5px;
        border: none;
        border-bottom: 1px solid red;
        font-size: 10px;
        padding: 0 0 5px 0;
        margin-bottom: 10px;
      }
      .form >textarea {
        width: 240px;
        height: 30px;
        resize: none;
        outline: none;
        border: none;
        border-bottom: 1px solid red;
        font-size: 10px;
        margin-top: 10px;
      }

      .form > button{
        width: 100px;
        height: 20px;
        border: none;
        background-color: red;
        color: white;
        cursor: pointer;
        margin: 20px 0 0 70px;
        font-size: 10px;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <div class="form">
      <h5>FORM LOGIN</h5>
      <label>Nama : </label><br />
      <input type="text" /> <br />
      <label>Username : </label><br />
      <input type="text" /> <br />
      <label>Message : </label><br />
      <textarea></textarea>
      <button>SUBMIT</button>
    </div>
  </body>
</html>
