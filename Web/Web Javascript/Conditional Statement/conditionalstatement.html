<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var nama = prompt('Masukkan nama Anda:');
        var umur = prompt('Masukkan umur Anda:');
        var cek = confirm('apakah yakin ingin mendaftar ?');
        if(cek == true){
            if(umur >= 17){
                document.write(nama + "<br>");
                document.write("anda dapat membuat akun !!");
            }
            else{
                document.write(nama + "<br>");
                document.write("umur tidak mencukupi");
            }
        }else{
            document.write(nama);
            document.write(" pembuatan akun dibatalkan");
        }
   </script>
</body>
</html>
