<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manipulasi Elemen dengan jQuery</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

    <h1>Daftar Item</h1>

    <form id="itemForm">
        <input type="text" id="newItem" placeholder="Masukkan item baru">
        <input type="text" required>
        <button type="submit">Tambahkan</button>
    </form>

    <ul id="itemList"></ul>

    <script>
        $(document).ready(function() {
            $('#itemForm').submit(function(event) {
                event.preventDefault(); 
                var newItem = $('#newItem').val().trim();
                $('#itemList').append('<li>' + newItem + ' <button class="deleteBtn">Hapus</button></li>');
            });

            $('#itemList').on('click', '.deleteBtn', function() {
                $(this).parent().remove();
            });
        });
    </script>

</body>
</html>
