<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Document</title>

  <body>
    <script>
      var luas = {
        panjang: 20,
        lebar: 10,

        persegipanjang: function () {
          var hasil = this.panjang * this.lebar;
          document.write("luas = " + hasil);

      };
    </script>
    <script>
      luas.persegipanjang();
    </script>
  </body>
