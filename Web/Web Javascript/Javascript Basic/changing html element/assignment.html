<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>KODING AKADEMI</h3>
    <button onclick="ubah()">rubah</button>

    <script>
        function ubah(){
            var element = document.getElementsByTagName("h3");
            element[0].style.backgroundColor = "yellow";
            element[0].style.color = "red";
            element[0].style.fontSize = "40px";
        }
    </script>
</body>
</html>
