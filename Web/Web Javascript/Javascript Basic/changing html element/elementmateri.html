<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="content">Koding Akademi</p>
    <script>
        document.getElementById("content").innerHTML = "Mediatech Indonesia";
    </script>

    <img id="photo" src="" alt="Koding">
    <script>
        document.getElementById("photo").alt = "Foto Koding Akademi";
    </script>

    <img id="koding" src="" alt="Koding">
    <script>
        document.getElementById("koding").setAttribute("alt","Foto Koding Akademi");
    </script>

    <h3>Koding Akademi</h3>
    <script>
        var element = document.getElementsByTagName("h3");
        element[0].style.backgroundColor = "yellow";
        element[0].style.fontSize = "40px";
        element[0].style.color = "red";
    </script>
</body>
</html>
