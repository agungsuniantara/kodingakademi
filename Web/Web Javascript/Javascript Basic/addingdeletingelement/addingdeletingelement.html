<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <ul id="mylist">
      <li>Teh</li>
      <li>Air</li>
    </ul>

    <button onclick="coba()">tambah</button>
    
    <script>
      function coba() {
        var child = document.createElement("LI");
        var chidnode = document.createTextNode("Kopi");
        child.appendChild(chidnode);
        document.getElementById("mylist").appendChild(child);
      }
    </script>
  </body>
</html>
