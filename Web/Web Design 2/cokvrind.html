<!DOCTYPE html>

  <head>

    <title>Document</title>
    <style>

      }
      .navbar {

      }

      }

        display: flex;
        gap: 25px;
      }
    </style>
  </head>
  <body>
    <div class="navbar">
      <img src="kodinggggg.jpg" alt="" />
      <div class="navbar-tengah">
        <p>Course</p>
        <p>Event</p>
        <p>Partner</p>
        <p>About Us</p>
        <p>Development</p>
      </div>
      <div class="navbar-kanan">
        <p>User</p>
        <p>Search</p>
      </div>
    </div>
  </body>
</html>
