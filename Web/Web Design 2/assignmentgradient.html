<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .gradien{
            height: 100px;
            width: 100px;
            margin: auto;
            margin-top: 20px;
            margin-bottom: 20px;
        }
        #kotak1{
            background-image: linear-gradient(180deg,red, yellow, green);
            border-top-left-radius: 20px;
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 50px;
            border-top-right-radius: 50px;
        }
        #kotak2{
            background-image: linear-gradient(to right, rgb(250, 248, 248), rgb(251, 7, 7));
            border-top-left-radius: 20px;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            border-top-right-radius: 20px;
        }
        #kotak3{
            background-image: linear-gradient(to right, rgb(252, 8, 8), rgb(235, 251, 7), green, blue, purple, pink);
            border-top-left-radius: 20px;
            border-bottom-left-radius: 50px;
            border-bottom-right-radius: 20px;
            border-top-right-radius: 50px;
        }
    </style>
</head>
<body>
    <div id="kotak1" class="gradien"></div>
    <div id="kotak2" class="gradien"></div>
    <div id="kotak3" class="gradien"></div>
</body>
</html>
