<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<style>

.img{
    width: 150px;
    height: 50px;
    margin-top: 10px;
    margin-bottom: 10px;
    margin-left: 10px;
}

.navbar, .navbar2{
  overflow: hidden;
  background-color: rgb(225, 156, 44);
}
.navbar a{
  float: right;
  font-size: 16px;
  color: white;
  text-align: center;
  padding: 14px 16px;
  text-decoration: none;
  margin-top: 10px;
}
.navbar2 a:hover {
  background-color: none;
}
.navbar a:hover, .dropdown:hover .dropbtn {
  background-color: red;
}

.dropdown {
  float: right;
  overflow: hidden;
}

.dropdown .dropbtn {
  font-size: 16px;  
  border: none;
  outline: none;
  color: white;
  padding: 14px 16px;
  background-color: inherit;
  font-family: inherit;
  margin: 0;
  margin-top: 10px;
}

.dropdown-content {
  display: none;
  position: absolute;
  background-color: #f9f9f9;
  min-width: 160px;
  box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
  z-index: 1;
}

.dropdown-content a {
  float: none;
  color: black;
  padding: 12px 16px;
  text-decoration: none;
  display: block;
  text-align: left;
}

.dropdown-content a:hover {
  background-color: #ddd;
}

.dropdown:hover .dropdown-content {
  display: block;
}

</style>
</head>
<body>
<div class="navbar2" style="margin-bottom: -70px;">
  <a href="#home" style="float: left; padding: 0px; margin-top: 0px;"><img src="kodingakademi.jpg" class="img"></a>
</div>
<div class="navbar">
    
    <a href="#home">Login</a>
    <a href="#home">About Use</a>
    <a href="#home">Promo</a>
    <a href="#home">Partner</a>
    <a href="#news">Event</a>

    <div class="dropdown">
    <button class="dropbtn">Course</button>
    <div class="dropdown-content">
      <a href="#">Link 1</a>
      <a href="#">Link 2</a>
      <a href="#">Link 3</a>
    </div>
  </div> 

</div>

</body>
</html>
