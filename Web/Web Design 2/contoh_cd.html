<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
    <title>Gradient</title>
    <style>
      .kotak1 {
        height: 200px;
        background-image: linear-gradient(red, yellow, orange);
        margin-bottom: 20px;
      }
      .kotak2 {
        height: 200px;
        background-image: linear-gradient(to right, red, yellow, orange);
        margin-bottom: 20px;
      }

      .kotak3 {
        height: 200px;
        background-image: linear-gradient(to left, red, yellow, orange);
        margin-bottom: 20px;
      }

      .kotak4 {
        height: 200px;
        background-image: linear-gradient(to bottom, red, yellow, orange);
        margin-bottom: 20px;
      }

      .kotak5 {
        height: 200px;
        background-image: linear-gradient(0deg, red, yellow, orange);
        margin-bottom: 20px;
      }

      .kotak6 {
        height: 200px;
        background-image: linear-gradient(90deg, red, yellow, orange);
        margin-bottom: 20px;
      }

      .kotak7 {
        height: 200px;
        background-image: linear-gradient(180deg, red, yellow, orange);
        margin-bottom: 20px;
      }

      .kotak8 {
        height: 200px;
        background-image: linear-gradient(-90deg, red, yellow, orange);
      }
    </style>
  </head>
  <body>
    <!-- top to bottom -->
    <div class="kotak1"></div>
    <div class="kotak2"></div>
    <div class="kotak3"></div>
    <div class="kotak4"></div>
    <div class="kotak5"></div>
    <div class="kotak6"></div>
    <div class="kotak7"></div>
    <div class="kotak8"></div>
  </body>
</html>
