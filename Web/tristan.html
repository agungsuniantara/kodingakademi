<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle Game</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #e3ffc2;
            margin: 0;
            padding: 20px;
        }
        footer {
            position: fixed;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 80px;
            background-color: #344b00; 
            text-align: left;
            padding-top: 30px;
            padding-left: 30px;
        }
        #darkmodeButton {
            width: 100px;
            height: 50px;
        }
        #puzzle {
            display: grid;
            grid-template-columns: repeat(3, 200px);
            grid-template-rows: repeat(3, 200px);
            gap: 5px;
            width: 615px;
            margin: 20px auto;
        }
        .tile {
            width: 200px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            color: white;
            cursor: pointer;
            text-align: center;
            border-radius: 10px;
        }
        .tile h1 {
            font-size: 100px;
            margin: 0;
        }
        .empty {
            background-color: white !important;
            cursor: default;
        }
    </style>
</head>
<body id="lightBg">
    <p id="darkLightText">jQuery is a fast, small, and feature-rich JavaScript library.</p>

    <div id="puzzle">
        <div class="tile" style="background-color: #c8ff00;" data-pos="1"><h1>1</h1></div>
        <div class="tile" style="background-color: #1eff00;" data-pos="2"><h1>2</h1></div>
        <div class="tile" style="background-color: #00ff80;" data-pos="3"><h1>3</h1></div>
        <div class="tile" style="background-color: #ffee00;" data-pos="4"><h1>4</h1></div>
        <div class="tile" style="background-color: #8ef600;" data-pos="5"><h1>5</h1></div>
        <div class="tile" style="background-color: #80f640;" data-pos="6"><h1>6</h1></div>
        <div class="tile" style="background-color: #ff7b00;" data-pos="7"><h1>7</h1></div>
        <div class="tile" style="background-color: #8ebd00;" data-pos="8"><h1>8</h1></div>
        <div class="tile empty" data-pos="9"></div>
    </div>
    
    <footer>
        <button id="darkmodeButton">Dark Mode</button>
    </footer>
    
    <script>
        $(document).ready(function(){
            const gridSize = 3;
            let emptyPos = 9;

            // Dark Mode Functionality
            $("#darkmodeButton").click(function(){
                $(this).prop("disabled", true);
                if($(this).text() === "Dark Mode") {
                    $("body").css({"background-color": "#1c1c1c", "color": "#ffffff"});
                    $(this).text("Light Mode");
                } else {
                    $("body").css({"background-color": "#e3ffc2", "color": "#000000"});
                    $(this).text("Dark Mode");
                }
                $(this).prop("disabled", false);
            });

            // Check if tile can move to the empty space
            function canMove(clickedPos, emptyPos) {
                const emptyRow = Math.floor((emptyPos - 1) / gridSize);
                const emptyCol = (emptyPos - 1) % gridSize;
                const clickedRow = Math.floor((clickedPos - 1) / gridSize);
                const clickedCol = (clickedPos - 1) % gridSize;
                return Math.abs(emptyRow - clickedRow) + Math.abs(emptyCol - clickedCol) === 1;
            }

            // Swap tiles
            function swapTiles(clickedTile) {
                const clickedPos = parseInt(clickedTile.data('pos'));
                const emptyTile = $('.empty');
                if (!canMove(clickedPos, emptyPos)) return;

                emptyPos = clickedPos;
                const clickedBg = clickedTile.css('background-color');
                const clickedContent = clickedTile.html();

                clickedTile.css('background-color', 'white').html('').addClass('empty');
                emptyTile.css('background-color', clickedBg).html(clickedContent).removeClass('empty');
            }

            // Shuffle the puzzle at start
            function shufflePuzzle(moves) {
                const directions = [-1, 1, -gridSize, gridSize];
                for (let i = 0; i < moves; i++) {
                    const validMoves = directions
                        .map(d => emptyPos + d)
                        .filter(p => p > 0 && p <= 9 && canMove(p, emptyPos));

                    const nextPos = validMoves[Math.floor(Math.random() * validMoves.length)];
                    const nextTile = $(`[data-pos="${nextPos}"]`);
                    swapTiles(nextTile);
                }
            }

            // Event listener for tile click
            $(document).on('click', '.tile:not(.empty)', function() {
                swapTiles($(this));
            });

            // Shuffle the puzzle when page loads
            shufflePuzzle(100);
        });
    </script>
</body>
</html>
