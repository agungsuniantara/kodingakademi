<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transition</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .element {
        transform: scale(1.2) rotate(45deg);
        background-color: aqua;
        width: 50px;
        height: 50px;
      }
    </style>
  </head>

  <body>
    <div class="element"></div>
  </body>
</html>
