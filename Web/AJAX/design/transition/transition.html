<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transition</title>
    <style>
      .element {
        transition: color 0.3s, background 0.3s;
      }
      .element:hover {
        color: red;
        background: yellow;
      }
    </style>
  </head>

  <body>
    <div class="element">Hover me</div>
  </body>
</html>
