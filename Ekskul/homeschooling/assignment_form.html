<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>Novel Services Login<h3>
    <form>
        <label>Username : </label>
        <input type="text" placeholder="Input username">
        <br>
        <br>
        <label>Password : </label>
        <input type="password" placeholder="Input password">
        <br>
        <br>
        <label>City of employment :</label>
        <input type="text" placeholder="Input data">
        <br>
        <br>
        <label>Web server : </label>
        <select>
            <option>-- choose a server --</option>
            <option>Google</option>
            <option>facebook</option>
        </select>
        <br>
        <br>
        <label>Please specify your role : </label>
        <input type="radio"> Admin
        <input type="radio"> Engineer
        <br>
        <br>
        <label>Single sign-on : </label>
        <input type="checkbox"> Mail
        <input type="checkbox"> Payroll
        <input type="checkbox"> Self Service
        <br>
        <br>
        <input type="submit" value="Login">
        <input type="submit" value="Reset">
    </form>
</body>
</html>
