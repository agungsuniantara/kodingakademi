<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .title{
            color: red;
            font-size: 20px;
            font-family: cursive;
            background-color: aqua;
            width: 150px;
            text-align: center;
        }
        .title2{
            color: blue;
            background-color: aquamarine;
            width: 150px;
        }
        .paragraph{
            color:aquamarine;
            background-color: azure;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }
    </style>
</head>
<body>
    <h1 class="title">hello world</h1>
    <h2 class="title2">this is title 2</h2>
    <p class="paragraph">this is paragraph</p>
    <p style="color: red;">this is paragraph 2</p>
</body>
</html>
