<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        *{
            margin: 0;
        }
        .body{
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: url(https://images.pexels.com/photos/66997/pexels-photo-66997.jpeg?auto=compress&cs=tinysrgb&dpr=1&w=500);
            background-repeat: no-repeat;
            background-size: cover;
        }
        .login{
            height: 40vh;
            width: 40vh;
            background-color:powderblue;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 2vh;
            border-radius: 10px;
            background-image: url(https://img.freepik.com/free-vector/grunge-watercolor-background-using-pastel-colours_1048-6530.jpg);
        }
        .text-login{
            text-align: center;
            font-size: 20px;
            margin-bottom: 30px;
        }
        .submit{
            width: 100%;
            margin-top: 7vh;
            background-color: cornflowerblue;
            color: white;
            border-radius: 10px;
            padding: 10px;
            border: none;
            outline: none;
        }
        .submit:hover{
            background-color:rgb(92, 137, 221);
            cursor: pointer;
        }
        input{
            padding: 10px;
            border: none;
            outline: none;
        }
    </style>
</head>
<body>
    <div class="body">
        <div class="login">
            <div class="text-login">LOGIN</div>
            <label>Username : </label>
            <input type="text">
            <label>Password : </label>
            <input type="password">
            <a href="home.html"><button class="submit">LOGIN</button></a>
        </div>
    </div>
</body>
</html>
